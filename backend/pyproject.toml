[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped async fixtures (the Postgres container engine) need a
# session-scoped event loop. The tests must use that same loop because an
# asyncpg connection created in one loop cannot be reused from another.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests", "app"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "core and shared never import slices"
type = "forbidden"
source_modules = ["app.core", "app.shared"]
forbidden_modules = ["app.slices"]
ignore_imports = [
    "app.core.registry -> app.slices.audit.models",
    "app.core.registry -> app.slices.chatbots.models",
    "app.core.registry -> app.slices.identity.models",
    "app.core.registry -> app.slices.jobs.models",
    "app.core.registry -> app.slices.tenancy.models",
    "app.core.registry -> app.slices.providers.models",
    "app.core.registry -> app.slices.knowledge.models",
]

[[tool.importlinter.contracts]]
name = "authorization and identity form a layered dependency graph"
type = "layers"
layers = [
    "app.slices.authz",
    "app.slices.identity",
    "app.slices.tenancy",
]

[[tool.importlinter.contracts]]
name = "cross-slice imports use published APIs only"
type = "forbidden"
source_modules = [
    "app.slices.admin",
    "app.slices.analytics",
    "app.slices.authz",
    "app.slices.identity",
    "app.slices.members",
    "app.slices.tenancy",
    "app.slices.audit",
    "app.slices.health",
    "app.slices.chatbots",
    "app.slices.jobs",
]
forbidden_modules = [
    "app.slices.jobs.models",
    "app.slices.providers.models",
    "app.slices.knowledge.models",
    "app.slices.jobs.repository",
    "app.slices.authz.dependencies",
    "app.slices.identity.dependencies",
    "app.slices.identity.models",
    "app.slices.identity.repository",
    "app.slices.identity.router",
    "app.slices.identity.schemas",
    "app.slices.identity.use_cases",
    "app.slices.tenancy.models",
    "app.slices.tenancy.repository",
    "app.slices.tenancy.seed",
    "app.slices.audit.actions",
    "app.slices.audit.models",
    "app.slices.audit.repository",
    "app.slices.health.router",
    "app.slices.chatbots.models",
    "app.slices.chatbots.repository",
    "app.slices.chatbots.router",
    "app.slices.chatbots.schemas",
    "app.slices.chatbots.service",
]
ignore_imports = [
    "app.slices.identity.* -> app.slices.identity.*",
    "app.slices.tenancy.* -> app.slices.tenancy.*",
    "app.slices.audit.* -> app.slices.audit.*",
    "app.slices.chatbots.* -> app.slices.chatbots.*",
    "app.slices.jobs.* -> app.slices.jobs.*",
    "app.slices.providers.* -> app.slices.providers.*",
    "app.slices.knowledge.* -> app.slices.knowledge.*",
    "app.slices.jobs.tests.test_worker -> app.worker",
    "app.slices.authz.api -> app.slices.authz.dependencies",
    "app.slices.identity.tests.test_models -> app.core.registry",
    "app.slices.authz.tests.test_guards -> app.main",
    "app.slices.authz.tests.test_guards -> app.slices.identity.use_cases.register",
    "app.slices.health.tests.test_health -> app.main",
    "app.slices.chatbots.tests.test_chatbot_api -> app.slices.identity.use_cases.register",
    "app.slices.chatbots.tests.test_concurrency -> app.slices.identity.use_cases.register",
    "app.slices.chatbots.tests.test_rls -> app.slices.identity.use_cases.register",
]
